log_level: info

logging:
  # Can be overridden with TORVIX_LOG_LEVEL.
  level: info
  # Can be overridden with TORVIX_LOG_DIR.
  dir: logs
  # Can be overridden with TORVIX_LOG_RETENTION_DAYS.
  retention_days: 14

http:
  # Can be overridden at runtime with TORVIX_HTTP_ADDRESS, TORVIX_HTTP_PORT, or TORVIX_API_PORT.
  address: ":8080"

db:
  # Use your production PostgreSQL/TimescaleDB endpoint.
  # If PostgreSQL runs on the Docker host, use host.docker.internal.
  dsn: "postgres://torvix:replace_with_password@postgres.example.internal:5432/torvix?sslmode=require"
  max_conns: 20
  min_conns: 2

ingestion:
  lookback_days: 30
  retention_days: 90
  compression_after_days: 7
  max_files_per_run: 25
  max_zero_yield_files: 25
  max_records_per_batch: 1000
  max_memory_buffer_records: 1000
  max_runtime: "10m"
  dry_run: false
  sample_mode: false

providers:
  oci:
    enabled: true
    namespace: "bling"
    bucket: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    prefix: "reports/"
    account: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    config_file: "/app/configs/oci_config"
    config_profile: "DEFAULT"
    passphrase: ""
    lookback_days: 30
    max_object_scan: 10000
    max_zero_yield_files: 25
  aws:
    enabled: false
    ingestion_mode: "cur_s3"
    region: "us-east-1"
    cost_metric: "UnblendedCost"
    lookback_days: 3
    report_lag_days: 2
    cur_bucket: ""
    cur_prefix: ""
    cur_region: "us-east-1"
    cur_format: "csv_gzip"
    cur_lookback_days: 3
    cur_report_lag_days: 2
    cur_local_path: ""

scheduler:
  enabled: true
  ingest_interval: "24h"

reporting:
  timezone: "Asia/Kolkata"
  daily_report_cron: "0 14 * * *"
  weekly_report_cron: "0 15 * * 1"
  require_complete_ingestion: true
  daily_report_target_lag_days: 1
  webhooks:
    - name: slack-finops
      type: slack
      url: "https://hooks.slack.com/services/replace/me"
      currency: INR
      enabled: false
    - name: teams-finops
      type: teams
      url: "https://outlook.office.com/webhook/replace/me"
      currency: INR
      enabled: false
    - name: telegram-finops
      type: telegram
      bot_token: "replace_with_bot_token"
      chat_id: "replace_with_chat_id"
      parse_mode: "Markdown"
      currency: INR
      enabled: false
    - name: discord-finops
      type: discord
      url: "https://discord.com/api/webhooks/replace/me"
      currency: INR
      enabled: false
    - name: email-finops
      type: email
      smtp_host: "smtp.example.com"
      smtp_port: 587
      username: "replace_with_smtp_user"
      password: "replace_with_smtp_password"
      from: "torvix@example.com"
      to:
        - "finops@example.com"
      subject_prefix: "[Torvix]"
      currency: INR
      enabled: false

waste:
  detection_enabled: true
  provider: "oci"
  scan_interval_hours: 24
  min_resource_age_days: 7
  stopped_instance_min_days: 3
  old_backup_days: 30
  min_cost_threshold: 0
  high_monthly_threshold: 50
  currency: USD
  enable_tag_exclusions: true
  exclusion_tag_keys:
    - "torvix:ignore"
    - "torvix:waste-ignore"
    - "finops:ignore"
    - "keep"
    - "retain"
    - "do-not-delete"

metrics:
  # The legacy torvix namespace remains the compatibility default for existing dashboards.
  namespace: torvix
  cost_stats_enabled: false

grafana:
  api_auth:
    enabled: true
    bearer_token: "replace_with_long_random_token"
