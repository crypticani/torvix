log_level: info

http:
  address: ":8080"

db:
  dsn: "postgres://cloudpulse:cloudpulse@postgres:5432/cloudpulse?sslmode=disable"
  max_conns: 20
  min_conns: 2

ingestion:
  lookback_days: 30
  retention_days: 180
  compression_after_days: 7
  max_files_per_run: 10
  max_records_per_batch: 1000
  max_memory_buffer_records: 1000
  max_runtime: "10m"
  dry_run: false
  sample_mode: true

providers:
  oci:
    enabled: true
    # OCI billing reports are stored in Object Storage namespace "bling"
    # and bucket name equal to the tenancy OCID.
    bucket: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    namespace: "bling"
    prefix: ""
    account: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    config_file: "/app/configs/oci_config"
    config_profile: "DEFAULT"
    passphrase: ""
    lookback_days: 30
    max_object_scan: 10000
    max_files_per_run: 10
    max_records_per_batch: 1000
    max_memory_buffer_records: 1000
    max_runtime: "10m"
    dry_run: false
    sample_mode: true

reporting:
  webhooks:
    - name: slack-finops
      type: slack
      url: "https://hooks.slack.com/services/replace/me"
      enabled: false
    - name: discord-finops
      type: discord
      url: "https://discord.com/api/webhooks/replace/me"
      enabled: false

metrics:
  namespace: cloudpulse
