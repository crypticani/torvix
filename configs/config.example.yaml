log_level: info

http:
  # Can be overridden at runtime with CLOUDPULSE_HTTP_ADDRESS or CLOUDPULSE_HTTP_PORT.
  address: ":8080"

db:
  dsn: "postgres://cloudpulse:cloudpulse@postgres:5432/cloudpulse?sslmode=disable"
  max_conns: 20
  min_conns: 2

ingestion:
  lookback_days: 30
  retention_days: 180
  compression_after_days: 45
  max_files_per_run: 10
  max_records_per_batch: 1000
  max_memory_buffer_records: 1000
  max_runtime: "10m"
  dry_run: false
  sample_mode: true

providers:
  oci:
    enabled: true
    # OCI billing reports are stored in Object Storage namespace "bling"
    # and bucket name equal to the tenancy OCID.
    bucket: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    namespace: "bling"
    prefix: ""
    account: "ocid1.tenancy.oc1..replace_with_tenancy_ocid"
    config_file: "/app/configs/oci_config"
    config_profile: "DEFAULT"
    passphrase: ""
    lookback_days: 30
    max_object_scan: 10000
    max_files_per_run: 10
    max_records_per_batch: 1000
    max_memory_buffer_records: 1000
    max_runtime: "10m"
    dry_run: false
    sample_mode: true

reporting:
  webhooks:
    - name: slack-finops
      type: slack
      url: "https://hooks.slack.com/services/replace/me"
      currency: INR
      enabled: false
    - name: teams-finops
      type: teams
      url: "https://outlook.office.com/webhook/replace/me"
      currency: INR
      enabled: false
    - name: telegram-finops
      type: telegram
      bot_token: "replace_with_bot_token"
      chat_id: "replace_with_chat_id"
      currency: INR
      enabled: false
    - name: discord-finops
      type: discord
      url: "https://discord.com/api/webhooks/replace/me"
      currency: INR
      enabled: false
    - name: email-finops
      type: email
      smtp_host: "smtp.example.com"
      smtp_port: 587
      username: "replace_with_smtp_user"
      password: "replace_with_smtp_password"
      from: "cloudpulse@example.com"
      to:
        - "finops@example.com"
      subject_prefix: "[CloudPulse]"
      currency: INR
      enabled: false

metrics:
  namespace: cloudpulse
