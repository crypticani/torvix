name: torvix

services:
  postgres:
    image: timescale/timescaledb:2.26.4-pg18
    container_name: torvix-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torvix}
      POSTGRES_USER: ${POSTGRES_USER:-torvix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-torvix}
    volumes:
      - postgres_data:/var/lib/postgresql
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-torvix} -d $${POSTGRES_DB:-torvix}"]
      interval: 10s
      timeout: 5s
      retries: 10

  torvix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torvix
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    environment:
      - TORVIX_HTTP_ADDRESS
      - TORVIX_HTTP_PORT
      - TORVIX_API_PORT
      - TORVIX_LOG_LEVEL
      - TORVIX_LOG_DIR
      - TORVIX_LOG_RETENTION_DAYS
      - CLOUDPULSE_HTTP_ADDRESS
      - CLOUDPULSE_HTTP_PORT
      - CLOUDPULSE_API_PORT
      - CLOUDPULSE_LOG_LEVEL
      - CLOUDPULSE_LOG_DIR
      - CLOUDPULSE_LOG_RETENTION_DAYS
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    command: ["-config", "/app/configs/config.yaml"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: torvix-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 64M

  grafana:
    image: grafana/grafana:13.0.1
    container_name: torvix-grafana
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 64M

volumes:
  postgres_data:
