name: torvix

services:
  torvix:
    image: ${TORVIX_IMAGE:-${CLOUDPULSE_IMAGE:-torvix:latest}}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torvix
    restart: unless-stopped
    network_mode: host
    environment:
      - TORVIX_HTTP_ADDRESS
      - TORVIX_HTTP_PORT
      - TORVIX_API_PORT
      - TORVIX_LOG_LEVEL
      - TORVIX_LOG_DIR
      - TORVIX_LOG_RETENTION_DAYS
      - CLOUDPULSE_HTTP_ADDRESS
      - CLOUDPULSE_HTTP_PORT
      - CLOUDPULSE_API_PORT
      - CLOUDPULSE_LOG_LEVEL
      - CLOUDPULSE_LOG_DIR
      - CLOUDPULSE_LOG_RETENTION_DAYS
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    command: ["-config", "/app/configs/config.prod.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${TORVIX_MEMORY_LIMIT:-${CLOUDPULSE_MEMORY_LIMIT:-512m}}
    cpus: "${TORVIX_CPU_LIMIT:-${CLOUDPULSE_CPU_LIMIT:-1.0}}"
    deploy:
      resources:
        limits:
          cpus: "${TORVIX_CPU_LIMIT:-${CLOUDPULSE_CPU_LIMIT:-1.0}}"
          memory: ${TORVIX_MEMORY_LIMIT:-${CLOUDPULSE_MEMORY_LIMIT:-512M}}
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "port=$${TORVIX_HTTP_PORT:-$${TORVIX_API_PORT:-$${CLOUDPULSE_HTTP_PORT:-$${CLOUDPULSE_API_PORT:-}}}}; addr=$${TORVIX_HTTP_ADDRESS:-$${CLOUDPULSE_HTTP_ADDRESS:-}}; if [ -z \"$$port\" ] && [ -n \"$$addr\" ]; then port=$${addr##*:}; fi; wget -qO- http://127.0.0.1:$${port:-8080}/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
