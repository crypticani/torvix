version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: cloudpulse-postgres
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse -d cloudpulse"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs:ro
    command: ["./cloudpulse", "-config", "/app/configs/config.yaml"]

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: cloudpulse-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    network_mode: host
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: cloudpulse-grafana
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
