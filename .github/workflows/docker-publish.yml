name: Publish Docker image

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: crypticani/torvix

jobs:
  docker:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is released from main
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-list -n 1 "refs/tags/$tag")"

          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $tag ($commit) is not reachable from origin/main."
            exit 1
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag $tag is not a valid Docker image tag."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
