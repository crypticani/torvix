apiVersion: 1

# Local development only. Production Grafana should use the CloudPulse API
# datasource example and keep PostgreSQL private.
datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
  - name: CloudPulse API
    uid: CloudPulseAPI
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://127.0.0.1:8080
    jsonData:
      auth_method: "none"
  - name: PostgreSQL
    uid: PostgreSQL
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    database: cloudpulse
    user: cloudpulse
    secureJsonData:
      password: cloudpulse
    jsonData:
      sslmode: "disable"
      postgresVersion: 18
      timescaledb: true
