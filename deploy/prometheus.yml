global:
  scrape_interval: 60s

scrape_configs:
  - job_name: cloudpulse
    static_configs:
      # Keep this port aligned with CloudPulse's actual listener.
      # If you run with CLOUDPULSE_HTTP_PORT=18080 or http.address: ":18080",
      # change this target to "127.0.0.1:18080".
      - targets: ["127.0.0.1:8080"]
